<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Product Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4" th:text="${product.id == null} ? 'Add Product' : 'Edit Product'">Product
                    Form</h3>

                <form th:action="@{/products}" th:object="${product}" method="post" id="product-form">
                    <input type="hidden" th:field="*{id}" id="product-id" />

                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" th:field="*{name}" class="form-control" id="name">
                        <div id="errorMessage" class="text-danger mt-1" th:if="${#fields.hasErrors('name')}"
                            th:errors="*{name}">
                            Name is required
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="price" class="form-label">Price</label>
                        <input type="number" step="0.01" th:field="*{price}" class="form-control" id="price">
                        <div id="priceErrorMessage" class="text-danger mt-1" th:if="${#fields.hasErrors('price')}"
                            th:errors="*{price}">
                            Price is required
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea th:field="*{description}" class="form-control" id="description" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="imageUrl" class="form-label">Image URL</label>
                        <input type="url" th:field="*{imageUrl}" class="form-control" id="imageUrl">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/products}" class="btn btn-secondary" id="btn-cancel">Cancel</a>
                        <button type="submit" class="btn btn-success" id="btn-save">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
